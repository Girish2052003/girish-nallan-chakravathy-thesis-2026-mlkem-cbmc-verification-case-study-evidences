version = 1

# ---------------------------------------------------------------------------
# Author-created repository-level research documentation
# ---------------------------------------------------------------------------

[[annotations]]
path = [
    "README.md",
    "AI-ASSITANCE-NOTICE.md",
    "DATA_AVAILABILITY.md",
    "THESIS_EVIDENCE_INDEX.md",
    "REUSE_AND_LICENSING.md",
    "CITATION.cff",
    "SECURITY.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "CC-BY-4.0"

# ---------------------------------------------------------------------------
# Author-created thesis evidence documentation
#
# 'closest' is deliberate:
# valid file-level licensing information, if present, remains authoritative.
# ---------------------------------------------------------------------------

[[annotations]]
path = [
    "docs/*.md",
    "docs/**/*.md"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "CC-BY-4.0"

# ---------------------------------------------------------------------------
# Independently authored repository maintenance / research software
#
# This rule is deliberately limited to the root tools directory.
# No rule is applied to upstream or experiment code.
# ---------------------------------------------------------------------------

[[annotations]]
path = "tools/*.py"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "Apache-2.0"

# ===========================================================================
# Repository configuration authored for this research repository.
# ===========================================================================

[[annotations]]
path = [
    ".gitattributes",
    ".gitignore"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "Apache-2.0"

# ===========================================================================
# Mechanically produced repository-tree and checksum records.
#
# No copyright ownership is asserted merely because these mechanical records
# were generated during the research.
# ===========================================================================

[[annotations]]
path = [
    "SHA256SUMS",
    "SHA256SUMS.sha256"
]
precedence = "override"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"

# ===========================================================================
# Original thesis evidence records and structured research documentation.
#
# Binary archives and patch files are deliberately NOT included here because
# they may encapsulate material with separate or mixed provenance.
# ===========================================================================

[[annotations]]
path = [
    "docs/thesis-evidence/*.csv",
    "docs/thesis-evidence/*.txt",
    "docs/thesis-evidence/*.tsv",
    "docs/thesis-evidence/*.json",
    "docs/thesis-evidence/SHA256SUMS",
    "docs/thesis-evidence/**/*_SHA256SUMS.txt",
    "docs/thesis-evidence/**/*.csv",
    "docs/thesis-evidence/**/*.tsv"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "CC-BY-4.0"

# Original validation / audit software in the thesis evidence package.

[[annotations]]
path = [
    "docs/thesis-evidence/*.py",
    "docs/thesis-evidence/**/*.py"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "Apache-2.0"

# ===========================================================================
# Original research reports, ledgers and analytical records.
# ===========================================================================

[[annotations]]
path = "reports/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "CC-BY-4.0"

# ===========================================================================
# Original thesis/research templates.
# ===========================================================================

[[annotations]]
path = "templates/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "CC-BY-4.0"

# ===========================================================================
# Research-development scripts authored or assembled as original research
# software for this study.
#
# Patch files, captured outputs and non-script artefacts are deliberately
# excluded from this rule.
# ===========================================================================

[[annotations]]
path = [
    "support/ai-assisted-human-corrected-development-scripts/*.sh",
    "support/ai-assisted-human-corrected-development-scripts/*.py"
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Girish Nallan Chakravathy"
SPDX-License-Identifier = "Apache-2.0"

