interface:
  display_name: "CBMC Execute"
  short_description: "Run exact CBMC tasks and preserve evidence"
  default_prompt: "Execute the already selected CBMC task exactly through the deterministic wrapper. Preserve argv, tool version, hashes, raw outputs, property inventory, statuses, traces, timeouts, and limitations. Do not choose or change the theorem, assumptions, assertions, bounds, checks, or repair."

policy:
  allow_implicit_invocation: true
