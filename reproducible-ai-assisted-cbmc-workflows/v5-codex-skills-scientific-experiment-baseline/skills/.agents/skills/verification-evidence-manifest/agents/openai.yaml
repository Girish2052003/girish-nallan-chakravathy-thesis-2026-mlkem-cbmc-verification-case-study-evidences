interface:
  display_name: "Verification Evidence Manifest"
  short_description: "Hash and organize existing verification evidence without grading it"
  default_prompt: "Build a hash-bound manifest from the verification artefacts I explicitly identify. Inventory claims and missing evidence mechanically; do not reinterpret CBMC results, grade Codex, or write a scientific conclusion."
policy:
  allow_implicit_invocation: true
